server:
  port: 8002
  shutdown: immediate

spring:
  application:
    name: short-link-admin
  datasource:
    # ShardingSphere 对 Driver 自定义，实现分库分表等隐藏逻辑
    driver-class-name: org.apache.shardingsphere.driver.ShardingSphereDriver
    # ShardingSphere 配置文件路径
    url: jdbc:shardingsphere:classpath:shardingsphere-config-${database.env:dev}.yaml?placeholder-type=environment
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: 123456
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-v4-pro
          temperature: 0.7
          max-tokens: 4096
  task:
    execution:
      pool:
        core-size: 2
        max-size: 4
        queue-capacity: 50
      thread-name-prefix: agent-async-

short-link:
  group:
    max-num: 3
    max-retry-num: 10
  flow-limit:
    enable: true
    time-window: 1
    max-access-count: 20
  agent:
    session-ttl-days: 7
    model:
      failure-threshold: 3
      open-duration-seconds: 30
      providers:
        ollama:
          order: 10
          # 注意：Spring AI(OpenAI 协议)会自动在 base-url 后补 /v1/chat/completions，
          # 因此这里【不要】带 /v1 后缀，否则会拼出 /v1/v1/chat/completions → 404
          base-url: ${OLLAMA_BASE_URL:http://127.0.0.1:11434}
          api-key: ${OLLAMA_API_KEY:}
          # 本地实际已 pull 的模型（qwen3:8b 未下载）：deepseek-r1:14b / llama3.1:8b / qwen3:14b
          # AI 助手需要函数调用能力，优先用 qwen3 系列或 llama3.1，不要用 deepseek-r1(推理模型不支持好工具调用)
          model: ${OLLAMA_MODEL:qwen3:14b}
          # 本地模型无需鉴权：不设 OLLAMA_API_KEY 也能注册
          api-key-required: false
        qwen:
          order: 20
          # 同上：不要带 /v1 后缀，Spring AI 会自动拼
          base-url: https://dashscope.aliyuncs.com/compatible-mode
          api-key: ${QWEN_API_KEY:}
          model: qwen-plus

