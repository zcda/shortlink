mode:
  type: Standalone
  repository:
    type: JDBC

# 数据源集合
dataSources:
  ds_0:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    url: jdbc:mysql://127.0.0.1:3306/link_zc?useUnicode=true&characterEncoding=UTF-8&rewriteBatchedStatements=true&allowMultiQueries=true&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root

rules:
  # 5.4.0+ 单表不再自动加载，需显式声明，否则访问未注册表会抛 TableNotExistsException
  - !SINGLE
    tables:
      - ds_0.t_group_unique
    defaultDataSource: ds_0
  - !SHARDING
    tables:
      t_user:
        actualDataNodes: ds_0.t_user_${0..15}
        tableStrategy:
          standard:
            shardingColumn: username
            shardingAlgorithmName: user_table_hash_mod
      t_group:
        actualDataNodes: ds_0.t_group_${0..15}
        tableStrategy:
          standard:
            shardingColumn: username
            shardingAlgorithmName: group_table_hash_mod
    shardingAlgorithms:
      user_table_hash_mod:
        type: INLINE
        props:
          algorithm-expression: t_user_${Math.abs(username.hashCode()) % 16}
      group_table_hash_mod:
        type: INLINE
        props:
          algorithm-expression: t_group_${Math.abs(username.hashCode()) % 16}
  - !ENCRYPT
    tables:
      t_user:
        columns:
          phone:
            cipher:
              name: phone
              encryptorName: common_encryptor
          mail:
            cipher:
              name: mail
              encryptorName: common_encryptor
    encryptors:
      common_encryptor:
        type: AES
        props:
          aes-key-value: zcdada-23sadaw2sdd
          digest-algorithm-name: SHA-256

props:
  sql-show: true