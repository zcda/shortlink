mode:
  type: Standalone
  repository:
    type: JDBC

# 数据源集合
dataSources:
  ds_0:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    url: jdbc:mysql://127.0.0.1:3306/link_zc?useUnicode=true&characterEncoding=UTF-8&rewriteBatchedStatements=true&allowMultiQueries=true&serverTimezone=Asia/Shanghai
    username: root
    password: 远程密码 还要改远程链接

rules:
  # 5.4.0+ 单表不再自动加载，需显式声明，否则访问未注册表会抛 TableNotExistsException
  - !SINGLE
    tables:
      - ds_0.t_link_stats_today
      - ds_0.t_link_access_stats
      - ds_0.t_link_os_stats
      - ds_0.t_link_device_stats
      - ds_0.t_link_network_stats
      - ds_0.t_link_browser_stats
      - ds_0.t_link_locale_stats
      - ds_0.t_link_access_logs
    defaultDataSource: ds_0
  - !SHARDING
    tables:
      t_link:
        actualDataNodes: ds_0.t_link_${0..15}
        tableStrategy:
          standard:
            shardingColumn: gid
            shardingAlgorithmName: link_table_hash_mod
      t_link_goto:
        actualDataNodes: ds_0.t_link_goto_${0..15}
        tableStrategy:
          standard:
            shardingColumn: full_short_url
            shardingAlgorithmName: link_table_goto_hash_mod
      t_group:
        actualDataNodes: ds_0.t_group_${0..15}
        tableStrategy:
          standard:
            shardingColumn: username
            shardingAlgorithmName: group_table_hash_mod
    shardingAlgorithms:
      link_table_hash_mod:
        type: INLINE
        props:
          algorithm-expression: t_link_${Math.abs(gid.hashCode()) % 16}
      link_table_goto_hash_mod:
        type: INLINE
        props:
          algorithm-expression: t_link_goto_${Math.abs(full_short_url.hashCode()) % 16}
      group_table_hash_mod:
        type: INLINE
        props:
          algorithm-expression: t_group_${Math.abs(username.hashCode()) % 16}

props:
  sql-show: true