server:
  port: 8001
  shutdown: immediate
spring:
  application:
    name: short-link-project
  datasource:
    # ShardingSphere 对 Driver 自定义，实现分库分表等隐藏逻辑
    driver-class-name: org.apache.shardingsphere.driver.ShardingSphereDriver
    # ShardingSphere 配置文件路径
    url: jdbc:shardingsphere:classpath:shardingsphere-config-${database.env:dev}.yaml?placeholder-type=environment
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: 123456
  mvc:
    view:
      prefix: /templates/
      suffix: .html
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        acknowledge-mode: manual          # 手动确认
        concurrency: ${RABBITMQ_CONCURRENCY:8}
        max-concurrency: ${RABBITMQ_MAX_CONCURRENCY:8}
        prefetch: ${RABBITMQ_PREFETCH:100}
        retry:
          enabled: true                   # 开启重试
          max-attempts: 3                  # 最大重试次数
          initial-interval: 1000            # 重试间隔


short-link:
  stats:
    # mq：异步投递 RabbitMQ；sync：跳转请求线程同步写入统计表
    mode: ${SHORT_LINK_STATS_MODE:mq}
    locale:
      enabled: ${SHORT_LINK_STATS_LOCALE_ENABLED:true}
      cache-enabled: ${SHORT_LINK_STATS_LOCALE_CACHE_ENABLED:true}
      cache-ttl-seconds: ${SHORT_LINK_STATS_LOCALE_CACHE_TTL:86400}
      # 高德开放平台 Web 服务 key，通过环境变量注入，勿提交到仓库
      amap-key: ${AMAP_KEY:}
  domain:
    default: zcdada.ink:8001
  goto-domain:
    white-list:
      enable: true
      names: '百度,必应,知乎,掘金,博客园'
      details:
        - baidu.com
        - bing.com
        - zhihu.com
        - juejin.cn
        - cnblogs.com


mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath:mapper/*.xml
